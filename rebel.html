    <style>
        body { font-family: -apple-system, system-ui, sans-serif; padding: 10px; max-width: 500px; margin: auto; background: #f0f2f5; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 1.1rem; color: #333; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .label { font-weight: bold; font-size: 0.7rem; color: #666; text-transform: uppercase; margin-top: 8px; display: block; }
        
        input { width: 100%; padding: 8px; margin: 4px 0 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #007bff; outline: none; }
        
        button { border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; font-size: 0.9rem; }
        .btn-main { background: #007bff; color: white; margin-top: 4px; }
        .btn-clear { background: #fff1f2; color: #e11d48; margin: 10px 0 15px 0; font-size: 0.75rem; border: 1px solid #fecdd3; }
        .btn-alt { background: #e4e6eb; color: #1c1e21; font-size: 0.8rem; margin-top: 2px; margin-bottom: 12px; }
        
        .success { background: #22c55e !important; color: white !important; }
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }

        .preview-box {
            width: 100%;
            height: 260px;
            padding: 8px;
            margin: 4px 0 4px 0;
            background: #f4f5f7;
            border: 1px dashed #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 10px;
            font-family: monospace;
            color: #333;
            resize: vertical;
        }
        .preview-box.small {
            height: 45px;
        }
    </style>
</head>

<body onload="loadMod()">

<div class="card">
    <h2>Rebel Script Gen</h2>
    
    <span class="label">Artist Name</span>
    <input type="text" id="nameInput" placeholder="Enter artist name...">
    
    <span class="label">Artist Handle</span>
    <input type="text" id="handleInput" placeholder="username (no @) or paste from post link">

    <span class="label">Moderator Handle</span>
    <input type="text" id="modInput" placeholder="Mod username (no @)" oninput="saveMod()">

    <button class="btn-clear" onclick="clearArtistFields()">Clear Artist Data Only</button>

    <span class="label">Main Script Preview</span>
    <textarea id="consoleMain" readonly class="preview-box"></textarea>

    <button class="btn-main" id="mainBtn" onclick="copyMain()">Copy Main Script</button>

    <hr>

    <span class="label">Feature Comment</span>
    <textarea id="consoleComment1" readonly class="preview-box small"></textarea>
    <button class="btn-alt" onclick="copyDirect('🌟Great shot  📸 🌟 Keep tagging us so we can see your beautiful photos in our feed 👏👏🖤', this)">Copy "Feature Comment" 📸</button>

    <span class="label">Post Comment</span>
    <textarea id="consoleComment2" readonly class="preview-box small"></textarea>
    <button class="btn-alt" onclick="copyDirect('🌟 Featured 🌟', this)">Copy "Post Comment" 🌟</button>
</div>

<script>
document.getElementById('handleInput').addEventListener('input', function() {
    const veroRegex = /vero\.(?:com|co)\/([^\/?#\s]+)/i;
    const match = this.value.match(veroRegex);
    if (match && match[1]) {
        this.value = match[1];
    }
    updateConsoles(); 
});

function loadMod() {
    const savedMod = localStorage.getItem('rebel_mod_name');
    if (savedMod) {
        document.getElementById('modInput').value = savedMod;
    }
    updateConsoles(); 
}

function saveMod() {
    const modValue = document.getElementById('modInput').value;
    localStorage.setItem('rebel_mod_name', modValue);
    updateConsoles();
}

function execCopy(text, btn) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    textArea.setSelectionRange(0, 99999);
    try {
        document.execCommand('copy');
        showFeedback(btn);
    } catch (err) {
        alert('Copy failed');
    }
    document.body.removeChild(textArea);
}

function generate() {
    const name = document.getElementById('nameInput').value || '[name]';
    const handle = document.getElementById('handleInput').value || '[handle]';
    const mod = document.getElementById('modInput').value || 'rebel_bnw';
    
    return `𝐟𝐞𝐚𝐭𝐮𝐫𝐞𝐝 𝐚𝐫𝐭𝐢𝐬𝐭\n☆ ${name}\n@${handle}\n.\n✼ Please visit this talented artist’s gallery\n━━━•☆•━━━\nSelected By Mod:\n@${mod}\n.\nFollow & Hashtag:\n@rebel_bnw \n#rebel_bnw \n━━━━━━━•☆•━━━━━━━\n#MoreOnVero #bnw4vero #verofriendsandfamily \n.\n#bnw #blackandwhite #monochrome #monomoods #lightandshadow #blackandwhitephotography #bw #monoculture #gomono #momo #fineart_bwphoto #Bnw_mood #darkandmoody\n.\nFor Hub Use:\n#rebelbnw_${handle}\n#rufeature_${handle}\n.`;
}

function updateConsoles() {
    document.getElementById('consoleMain').value = generate();
    document.getElementById('consoleComment1').value = "🌟Great shot  📸 🌟 Keep tagging us so we can see your beautiful photos in our feed 👏👏🖤";
    document.getElementById('consoleComment2').value = "🌟 Featured 🌟";
}

document.getElementById('nameInput').addEventListener('input', updateConsoles);
document.getElementById('modInput').addEventListener('input', updateConsoles);

function copyMain() {
    execCopy(generate(), document.getElementById('mainBtn'));
}

function copyDirect(text, btn) {
    execCopy(text, btn);
}

function showFeedback(btn) {
    const oldText = btn.innerText;
    btn.innerText = "✓ Copied!";
    btn.classList.add('success');
    setTimeout(() => {
        btn.innerText = oldText;
        btn.classList.remove('success');
    }, 1200);
}

function clearArtistFields() {
    document.getElementById('nameInput').value = '';
    document.getElementById('handleInput').value = '';
    document.getElementById('nameInput').focus();
    updateConsoles(); 
}
</script>

</body>
