<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rebel Script Gen</title>
    
    <!-- iOS and Android App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rebel Script">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f0f2f5">
    
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; padding: 10px; max-width: 500px; margin: auto; background: #f0f2f5; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 1.1rem; color: #333; text-align: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .label { font-weight: bold; font-size: 0.7rem; color: #666; text-transform: uppercase; margin-top: 8px; display: block; }
        
        input, select { width: 100%; padding: 8px; margin: 4px 0 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { border-color: #007bff; outline: none; }
        
        button { border: none; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; width: 100%; font-size: 0.9rem; }
        .btn-main { background: #007bff; color: white; margin-top: 4px; }
        .btn-clear { background: #fff1f2; color: #e11d48; margin: 10px 0 15px 0; font-size: 0.75rem; border: 1px solid #fecdd3; }
        .btn-alt { background: #e4e6eb; color: #1c1e21; font-size: 0.8rem; margin-top: 2px; margin-bottom: 12px; }
        
        .success { background: #22c55e !important; color: white !important; }
        hr { border: 0; border-top: 1px solid #eee; margin: 15px 0; }

        .preview-box {
            width: 100%;
            height: 260px;
            padding: 8px;
            margin: 4px 0 4px 0;
            background: #f4f5f7;
            border: 1px dashed #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 10px;
            font-family: monospace;
            color: #333;
            resize: vertical;
        }
        .preview-box.small {
            height: 45px;
        }
    </style>
</head>

<body onload="loadSettings()">

<div class="card">
    <h2>Rebel Script Gen</h2>
    
    <span class="label">Choose Gallery</span>
    <select id="gallerySelect" onchange="saveSettings(); updateConsoles()">
        <!-- Values here must match your filename exactly (e.g., value="rebel_bnw" -> rebel_bnw.txt) -->
        <option value="rebel_bnw">Rebel BNW</option>
        <option value="rebels_united">Rebels United</option>
        <option value="rebel_macro">Rebel Macro</option>
        <option value="rebel_skies">Rebel Skies</option>
    </select>

    <span class="label">Choose Role</span>
    <select id="roleSelect" onchange="saveSettings(); updateConsoles()">
        <option value="Mod">Mod</option>
        <option value="Admin">Admin</option>
    </select>
    
    <span class="label">Your Username</span>
    <input type="text" id="modInput" placeholder="Your username (no @)" oninput="saveSettings(); updateConsoles()">

    <span class="label">Artist Name</span>
    <input type="text" id="nameInput" placeholder="Enter artist name..." oninput="updateConsoles()">
    
    <span class="label">Artist Handle</span>
    <input type="text" id="handleInput" placeholder="username (no @) or paste from post link">

    <button class="btn-clear" onclick="clearArtistFields()">Clear Artist Data Only</button>

    <span class="label">Main Script Preview</span>
    <textarea id="consoleMain" readonly class="preview-box">Loading template...</textarea>

    <button class="btn-main" id="mainBtn" onclick="copyMain()">Copy Main Script</button>

    <hr>

    <span class="label">Feature Comment</span>
    <textarea id="consoleComment1" readonly class="preview-box small"></textarea>
    <button class="btn-alt" onclick="copyDirect('🌟Great shot  📸 🌟 Keep tagging us so we can see your beautiful photos in our feed 👏👏🖤', this)">Copy "Feature Comment" 📸</button>

    <span class="label">Post Comment</span>
    <textarea id="consoleComment2" readonly class="preview-box small"></textarea>
    <button class="btn-alt" onclick="copyDirect('🌟 Featured 🌟', this)">Copy "Post Comment" 🌟</button>
</div>

<script>
// Format the vero URL if pasted
document.getElementById('handleInput').addEventListener('input', function() {
    const veroRegex = /vero\.(?:com|co)\/([^\/?#\s]+)/i;
    const match = this.value.match(veroRegex);
    if (match && match[1]) {
        this.value = match[1];
    }
    updateConsoles(); 
});

function loadSettings() {
    if (localStorage.getItem('rebel_mod_name')) document.getElementById('modInput').value = localStorage.getItem('rebel_mod_name');
    if (localStorage.getItem('rebel_role')) document.getElementById('roleSelect').value = localStorage.getItem('rebel_role');
    if (localStorage.getItem('rebel_gallery')) document.getElementById('gallerySelect').value = localStorage.getItem('rebel_gallery');
    updateConsoles(); 
}

function saveSettings() {
    localStorage.setItem('rebel_mod_name', document.getElementById('modInput').value);
    localStorage.setItem('rebel_role', document.getElementById('roleSelect').value);
    localStorage.setItem('rebel_gallery', document.getElementById('gallerySelect').value);
}

// Fetch the template text file from the Templates folder
async function fetchTemplate(galleryName) {
    try {
        const response = await fetch(`Templates/${galleryName}.txt`);
        if (!response.ok) {
            throw new Error(`File not found: Templates/${galleryName}.txt`);
        }
        return await response.text();
    } catch (error) {
        return `Error: Could not load template for ${galleryName}.\nMake sure Templates/${galleryName}.txt exists in your repository.\n\n(${error.message})`;
    }
}

// Update text areas
async function updateConsoles() {
    const gallery = document.getElementById('gallerySelect').value;
    const role = document.getElementById('roleSelect').value;
    const name = document.getElementById('nameInput').value || '[name]';
    const handle = document.getElementById('handleInput').value || '[handle]';
    const mod = document.getElementById('modInput').value || '[username]';
    
    // Fetch raw template text
    let template = await fetchTemplate(gallery);

    // Replace placeholders with current input values
    const generatedScript = template
        .replace(/{name}/g, name)
        .replace(/{handle}/g, handle)
        .replace(/{role}/g, role)
        .replace(/{mod}/g, mod);

    document.getElementById('consoleMain').value = generatedScript;
    document.getElementById('consoleComment1').value = "🌟Great shot  📸 🌟 Keep tagging us so we can see your beautiful photos in our feed 👏👏🖤";
    document.getElementById('consoleComment2').value = "🌟 Featured 🌟";
}

// Copy actions
function execCopy(text, btn) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    document.body.appendChild(textArea);
    textArea.select();
    textArea.setSelectionRange(0, 99999);
    try {
        document.execCommand('copy');
        showFeedback(btn);
    } catch (err) {
        alert('Copy failed');
    }
    document.body.removeChild(textArea);
}

// Grabs whatever is currently in the preview box to copy
function copyMain() {
    const scriptToCopy = document.getElementById('consoleMain').value;
    execCopy(scriptToCopy, document.getElementById('mainBtn'));
}

function copyDirect(text, btn) {
    execCopy(text, btn);
}

function showFeedback(btn) {
    const oldText = btn.innerText;
    btn.innerText = "✓ Copied!";
    btn.classList.add('success');
    setTimeout(() => {
        btn.innerText = oldText;
        btn.classList.remove('success');
    }, 1200);
}

function clearArtistFields() {
    document.getElementById('nameInput').value = '';
    document.getElementById('handleInput').value = '';
    document.getElementById('nameInput').focus();
    updateConsoles(); 
}
</script>

</body>
</html>
